<!doctype html>
<html lang="en">
<head>
{{template "head" "Set up"}}
</head>
<body>
	<h1>Set up Repo Speaks</h1>
	<p>Create the owner account. The owner has every permission in every project.</p>

	{{with .Error}}<p role="alert">{{.}}</p>{{end}}

	<form method="post" action="/setup">
		<p><label>Username <input name="username" value="{{.Username}}" required autocomplete="username"></label></p>
		<p>3 to 32 characters: lowercase letters, digits, - or _.</p>
		<p><label>Password <input name="password" type="password" required minlength="12" autocomplete="new-password"></label></p>
		<p><label>Password again <input name="password_again" type="password" required minlength="12" autocomplete="new-password"></label></p>
		<p>At least 12 characters. A few random words work well.</p>
		<button>Create owner account</button>
	</form>
</body>
</html>
